name: "Terraform Deployment"

on:
  push:
    branches:
      - main
  pull_request:

# Required for GitHub Actions to issue an OIDC JWT token for GCP WIF
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP via Workload Identity Federation
      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/514571227388/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-actions-tf@my-project-vs-code-506105.iam.gserviceaccount.com'

      # Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Execute Terraform Commands
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve